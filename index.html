<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Boucle d'Or</title>
<meta name="description" content="Backyard ultra · Première édition · Les Granges Cathus · 7 novembre 2026">
<meta property="og:title" content="La Boucle d'Or">
<meta property="og:description" content="Une boucle par heure. Le dernier debout gagne. Sam. 7 nov. aux Granges Cathus.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23F5A400' stroke='%232A1A08' stroke-width='5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>/* Layout: one long scroll with sticky pill nav; colorful "curl" coils as dividers; castle map; swipeable runner cards; live boards for rooms + carpool */
:root{
  --bg:#FFFBF2; --surface:#FFFFFF; --sunk:#FFF1CF; --ink:#2A1A08; --muted:#7A6447; --line:#F0DDB0;
  --gold:#F5A400; --gold-deep:#C46F00; --tomato:#E8553D; --sky:#2F8FDB; --mint:#23A06B; --pink:#E8679E;
  --on-color:#FFFFFF; --on-gold:#2A1A08;
  --display:"Bagel Fat One","Cooper Black",Georgia,serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B140C; --surface:#251B10; --sunk:#33250F; --ink:#FCEFD6; --muted:#CDB28A; --line:#4D3A20;
  --gold:#FFB72E; --gold-deep:#FFC85C; --tomato:#FF7A62; --sky:#62B2F5; --mint:#4FCB92; --pink:#FF8DBF;
  --on-color:#1B140C; --on-gold:#1B140C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B140C; --surface:#251B10; --sunk:#33250F; --ink:#FCEFD6; --muted:#CDB28A; --line:#4D3A20;
  --gold:#FFB72E; --gold-deep:#FFC85C; --tomato:#FF7A62; --sky:#62B2F5; --mint:#4FCB92; --pink:#FF8DBF;
  --on-color:#1B140C; --on-gold:#1B140C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1060px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:clamp(32px,5.4vw,48px)}
h3{font-size:22px}
p{margin:0}
.c-gold{color:var(--gold-deep)} .c-tomato{color:var(--tomato)} .c-sky{color:var(--sky)} .c-mint{color:var(--mint)} .c-pink{color:var(--pink)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.tag.todo{color:var(--tomato);border-color:currentColor;background:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:2px solid var(--ink);border-radius:99px;padding:9px 18px;font-weight:700;cursor:pointer;background:var(--gold);color:var(--on-gold);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
a{color:var(--sky)}
input,select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:64px}
.linkbtn{background:none;border:0;padding:0;color:var(--tomato);cursor:pointer;font-size:13px;text-decoration:underline}

/* nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:2px solid var(--ink);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px))}
nav.top .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;align-items:center}
nav.top a{flex:none;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:99px}
nav.top a:hover{background:var(--sunk)}
nav.top a.brand{font-family:var(--display);font-weight:400;color:var(--gold-deep);font-size:18px}
nav.top .orga-btn{margin-left:auto;flex:none}

/* coil divider */
.coil{display:block;width:100%;height:34px;margin-block:8px}
.coil path{fill:none;stroke-width:4;stroke-linecap:round}

section{padding-block:44px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:26px}
.sec-head p{max-width:56ch}

/* hero */
.hero{padding-block:40px 28px;display:grid;grid-template-columns:1.2fr .9fr;gap:32px;align-items:center}
.hero .logo{max-width:340px;width:100%;height:auto;display:block;margin-bottom:8px}
.hero h1{font-size:clamp(54px,10.5vw,110px);letter-spacing:-.01em;line-height:.95}
.hero h1 .l1{color:var(--gold)} .hero h1 .l2{color:var(--tomato)}
.hero .tagline{font-family:var(--display);font-size:clamp(20px,3vw,28px);margin-top:12px;color:var(--ink)}
.hero .lede{font-size:18px;max-width:46ch;margin-top:12px}
.hero .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.facts .tag:nth-child(5n+1){background:var(--gold);color:var(--on-gold);border-color:var(--ink)}
.facts .tag:nth-child(5n+2){background:var(--sky);color:var(--on-color);border-color:var(--ink)}
.facts .tag:nth-child(5n+3){background:var(--mint);color:var(--on-color);border-color:var(--ink)}
.facts .tag:nth-child(5n+4){background:var(--pink);color:var(--on-color);border-color:var(--ink)}
.facts .tag:nth-child(5n+5){background:var(--tomato);color:var(--on-color);border-color:var(--ink)}
.bell{background:var(--surface);border:2px solid var(--ink);border-radius:28px;padding:22px;box-shadow:7px 7px 0 var(--pink)}
.bell .count{display:flex;gap:10px;margin-top:8px}
.bell .count div{flex:1;text-align:center;border-radius:14px;padding:10px 4px;border:2px solid var(--ink)}
.bell .count div:nth-child(1){background:var(--gold);color:var(--on-gold)}
.bell .count div:nth-child(2){background:var(--sky);color:var(--on-color)}
.bell .count div:nth-child(3){background:var(--mint);color:var(--on-color)}
.bell .count b{display:block;font-family:var(--display);font-weight:400;font-size:40px;font-variant-numeric:tabular-nums;line-height:1}
.bell .count small{font-family:var(--mono);font-size:11px;text-transform:uppercase}
.bell .rule{margin-top:14px;font-size:14px}
.bell .rule b{font-family:var(--mono);font-weight:500}

.format{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.format div{border:2px solid var(--ink);border-radius:var(--r);padding:14px;background:var(--surface)}
.format b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1}
.format div:nth-child(1) b{color:var(--gold-deep)} .format div:nth-child(2) b{color:var(--sky)} .format div:nth-child(3) b{color:var(--tomato)} .format div:nth-child(4) b{color:var(--mint)}
.format span{font-size:14px;color:var(--muted)}

/* timeline */
.days{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:16px;align-items:start}
.day{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:18px;min-width:0}
.day:nth-child(1){box-shadow:5px 5px 0 var(--sky)} .day:nth-child(2){box-shadow:5px 5px 0 var(--gold)} .day:nth-child(3){box-shadow:5px 5px 0 var(--mint)}
.day h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day h3 small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.day ol{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.day li{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:baseline}
.day time{font-family:var(--mono);font-size:13px;color:var(--gold-deep);font-variant-numeric:tabular-nums}
.day li p{font-size:15px;min-width:0}
.day li p small{display:block;color:var(--muted);font-size:13px}

/* course */
.course{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.course svg{width:100%;height:auto;max-width:100%;display:block}
.m-bg{fill:var(--sunk)} .m-grass{fill:var(--mint);opacity:.22} .m-tree{fill:var(--mint)}
.m-loop{fill:none;stroke:var(--gold);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.m-dash{fill:none;stroke:var(--surface);stroke-width:2;stroke-dasharray:6 10}
.m-wall{fill:var(--surface);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.m-roof{fill:var(--tomato);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.m-gate{fill:var(--ink)}
.m-ink{fill:var(--ink)} .m-lbl{fill:var(--muted);font-family:"DM Mono",monospace;font-size:12px}
.m-big{fill:var(--gold-deep);font-family:"Bagel Fat One",Georgia,serif;font-size:30px}
.m-flag{fill:var(--pink);stroke:var(--ink);stroke-width:2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px;margin:0}
.kv dt{font-family:var(--mono);font-size:12px;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0;min-width:0}
.course .info{display:grid;gap:14px}

/* runners */
.seg{display:inline-flex;background:var(--sunk);border-radius:99px;padding:4px;border:2px solid var(--ink)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.deck-zone{display:grid;grid-template-columns:auto minmax(0,360px) auto;gap:18px;justify-content:center;align-items:center}
.deck{position:relative;height:550px;width:100%;max-width:360px;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--surface);border:2.5px solid var(--ink);border-radius:26px;overflow:hidden;
  display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;will-change:transform;cursor:grab;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.card.dragging{transition:none;cursor:grabbing}
.card .photo{flex:none;height:255px;position:relative;display:grid;place-items:center;overflow:hidden;border-bottom:2.5px solid var(--ink)}
.card .photo img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.card .initials{font-family:var(--display);font-size:100px;color:var(--on-color);opacity:.95}
.card .bib{position:absolute;top:12px;left:12px;background:var(--surface);color:var(--ink);font-family:var(--mono);font-weight:500;font-size:13px;padding:4px 10px;border-radius:8px;border:2px solid var(--ink)}
.card .orga{position:absolute;top:12px;right:12px;background:var(--surface)}
.card .body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.card h3{font-size:30px}
.card .nick{color:var(--muted);font-size:14px;margin-top:-6px}
.card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card .stats div{background:var(--sunk);border-radius:10px;padding:6px 8px;min-width:0}
.card .stats b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1;overflow-wrap:anywhere}
.card .stats small{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--muted)}
.card .quote{font-size:14px;font-style:italic;color:var(--muted);overflow:hidden}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.bg-gold{background:var(--gold)} .bg-tomato{background:var(--tomato)} .bg-sky{background:var(--sky)} .bg-mint{background:var(--mint)} .bg-pink{background:var(--pink)}
.round{width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);cursor:pointer;font-size:22px;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink)}
.round:hover{background:var(--gold);color:var(--on-gold)}
.deck-count{text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:16px}
.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mini{background:var(--surface);border:2px solid var(--ink);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block}
.mini .ph{aspect-ratio:1;display:grid;place-items:center;font-family:var(--display);font-size:46px;color:var(--on-color);overflow:hidden;max-width:100%;border-bottom:2px solid var(--ink)}
.mini .ph img{width:100%;height:100%;object-fit:cover}
.mini .tx{padding:8px 10px}
.mini b{display:block}
.mini small{color:var(--muted);font-size:12px}

/* rooms */
.who{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--sunk);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:16px}
.who label{font-weight:700}
.who input{max-width:220px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.room{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.room header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.room header b{font-family:var(--display);font-weight:400;font-size:22px}
.room .bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.room .bar i{display:block;height:100%;background:var(--mint)}
.room.full .bar i{background:var(--tomato)}
.room ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.room li{border-radius:99px;padding:3px 10px;font-size:14px;display:inline-flex;gap:6px;align-items:center;background:var(--sunk)}
.room li.me{background:var(--gold);color:var(--on-gold)}
.room li.free{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.room li button{border:0;background:none;cursor:pointer;padding:0;font-size:14px;line-height:1;color:inherit}

/* meals */
.meals{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.meal{background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:14px;display:grid;gap:4px}
.meal .when{font-family:var(--mono);font-size:12px;text-transform:uppercase}
.meal:nth-child(5n+1) .when{color:var(--gold-deep)} .meal:nth-child(5n+2) .when{color:var(--sky)} .meal:nth-child(5n+3) .when{color:var(--mint)} .meal:nth-child(5n+4) .when{color:var(--pink)} .meal:nth-child(5n+5) .when{color:var(--tomato)}
.meal b{font-size:17px}

/* carpool */
.cp-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.cp-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.rides{display:grid;gap:12px}
.ride{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.ride.offer{box-shadow:5px 5px 0 var(--sky)}
.ride.request{box-shadow:5px 5px 0 var(--pink)}
.ride .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ride .top b{font-size:18px}
.ride .route{font-family:var(--mono);font-size:14px}
.seats{display:flex;gap:4px;align-items:center}
.seat{width:16px;height:16px;border-radius:5px;border:2px solid var(--sky)}
.seat.taken{background:var(--sky)}
.replies{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.reply{font-size:14px}
.reply b{font-weight:700}
.reply-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.reply-form input[type=text]{flex:1 1 140px;min-width:0}
.form{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:18px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);box-shadow:6px 6px 0 var(--gold)}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
.banner{background:var(--sunk);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}

.prac{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.prac > div{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.prac ul{margin:0;padding-left:18px;font-size:15px}
footer{padding-block:30px 60px;text-align:center;color:var(--muted);font-size:14px}
footer b{font-family:var(--display);font-weight:400;color:var(--gold-deep);font-size:24px;display:block}

/* organizer */
.orgpanel{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;grid-template-rows:auto 1fr;
  padding:env(safe-area-inset-top,0px) max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.orga-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:2px solid var(--ink);background:var(--sunk)}
.orga-bar h2{font-size:24px;margin-right:auto}
.orga-main{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
.orga-tabs{display:flex;flex-direction:column;gap:4px;padding:14px;border-right:2px solid var(--line);overflow:auto}
.orga-tabs button{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:600}
.orga-tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.orga-body{overflow:auto;padding:18px 16px 80px}
.orga-body .inner{max-width:760px;display:grid;gap:12px}
.ed-item{background:var(--surface);border:2px solid var(--ink);border-radius:14px}
.ed-item summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;list-style:none}
.ed-item summary::-webkit-details-marker{display:none}
.ed-item summary .thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;background:var(--sunk)}
.ed-item summary span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-fields{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed-fields label{display:grid;gap:4px;font-size:13px;font-weight:600;min-width:0}
.ed-fields label.wide{grid-column:1/-1}
.ed-fields label.check{display:flex;gap:8px;align-items:center}
.ed-fields label.check input{width:auto}
.ed-img{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ed-img img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:2px solid var(--ink)}
.ed-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.ed-hint{font-size:13px;color:var(--muted)}
.live-list{display:grid;gap:6px}
.live-list div{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}

@media (max-width:860px){
  .hero,.course,.cp-grid{grid-template-columns:1fr}
  .days,.prac{grid-template-columns:1fr}
  .format{grid-template-columns:1fr 1fr}
  .form{position:static}
  .orga-main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .orga-tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:2px solid var(--line)}
  .orga-tabs button{flex:none}
}
@media (max-width:520px){
  .deck-zone{grid-template-columns:1fr}
  .deck-zone .round{display:none}
  .deck{height:530px;margin:0 auto}

/* coil = a row of loops (the "boucles") */
function coil(color, loops=26){
  const w = 1000, h = 34, step = w/loops; let d = "M0 24";
  for(let i=0;i<loops;i++){ const x=i*step; d += ` C ${x+step*0.9} 24, ${x+step*1.1} 4, ${x+step*0.6} 4 S ${x+step*0.2} 24, ${x+step} 24`; }
  return `<svg class="coil" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" style="stroke:var(--${color})"/></svg>`;
}

function renderDeck(){
  const deck = $("#deck"); if(!deck) return;

  const show = order.slice(0,3).reverse();
  show.forEach((idx,k)=>{
    const depth = show.length-1-k;
    const el = document.createElement("article");
    el.className = "card"; el.innerHTML = cardHTML(SITE.runners[idx], idx);
    el.style.transform = `translateY(${depth*10}px) scale(${1-depth*0.04}) rotate(${depth?(depth%2?2.5:-2.5):0}deg)`;
    el.style.zIndex = 10-depth;
    if(depth===0) attachDrag(el);

function go(dir){
  const top = $("#deck").lastElementChild; if(!top) return;
  top.style.transform = `translateX(${dir*130}%) rotate(${dir*18}deg)`; top.style.opacity = 0;
  setTimeout(()=>{ if(dir>0) order.push(order.shift()); else order.unshift(order.pop()); renderDeck(); }, 220);
}
function attachDrag(el){
  let x0=null, dx=0;
  el.addEventListener("pointerdown",e=>{ x0=e.clientX; dx=0; try{el.setPointerCapture(e.pointerId)}catch(_){} el.classList.add("dragging"); });
  el.addEventListener("pointermove",e=>{ if(x0===null) return; dx=e.clientX-x0; el.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`; });
  const end=()=>{ if(x0===null) return; x0=null; el.classList.remove("dragging"); if(Math.abs(dx)>80) go(dx>0?1:-1); else el.style.transform="none"; };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
}

const ts = s => Date.parse(s)||0;
async function loadBeds(){
  const { data, error } = await sb.from("beds").select("id,room_key,name,owner_hash,created_at"); if(error) throw error;
  beds = data.map(r=>({id:r.id, roomKey:r.room_key, name:r.name, mine:r.owner_hash===MYHASH, createdAt:ts(r.created_at)}));
  renderRooms(); renderOrgaLive();
}
async function loadRides(){
  const [a,b] = await Promise.all([
    sb.from("rides").select("id,type,name,from_city,when_text,seats,note,owner_hash,created_at"),
    sb.from("replies").select("id,ride_id,name,body,joins,owner_hash,created_at")]);
  if(a.error) throw a.error; if(b.error) throw b.error;
  rides = a.data.map(r=>({id:r.id, type:r.type, name:r.name, from:r.from_city, when:r.when_text, seats:+r.seats||1, note:r.note, mine:r.owner_hash===MYHASH, createdAt:ts(r.created_at)}));
  replies = {};
  b.data.forEach(r=>{ (replies[r.ride_id] ||= []).push({id:r.id, name:r.name, body:r.body, joins:r.joins, mine:r.owner_hash===MYHASH, createdAt:ts(r.created_at)}); });
  renderRides(); renderOrgaLive();
}
let reloadTimer = {};
function soon(key, fn){ clearTimeout(reloadTimer[key]); reloadTimer[key]=setTimeout(()=>fn().catch(()=>{}), 250); }

async function connect(){
  MYHASH = await sha256(SECRET);
  try{
    if(!CFG.url || !CFG.anonKey || !window.supabase) throw new Error("config");
    sb = window.supabase.createClient(CFG.url, CFG.anonKey, {auth:{persistSession:false}});
    const { data, error } = await sb.from("site").select("data").eq("id",1).maybeSingle();
    if(!error && data && data.data && data.data.meta){ SITE = data.data; order = SITE.runners.map((_,i)=>i); keepForm(render); }
    if(ADMIN_PWD){ const ok = await sb.rpc("check_admin",{p_pwd:ADMIN_PWD}); isAdmin = !!(ok && ok.data); if(!isAdmin){ ADMIN_PWD=""; try{sessionStorage.removeItem("bdo-admin")}catch(e){} } }
    live = true;
    await Promise.all([loadBeds(), loadRides()]);
    sb.channel("live")
      .on("postgres_changes",{event:"*",schema:"public",table:"beds"},()=>soon("b",loadBeds))
      .on("postgres_changes",{event:"*",schema:"public",table:"rides"},()=>soon("r",loadRides))
      .on("postgres_changes",{event:"*",schema:"public",table:"replies"},()=>soon("r",loadRides))
      .subscribe();
    setInterval(()=>{ if(!document.hidden){ loadBeds().catch(()=>{}); loadRides().catch(()=>{}); } }, 45000);
  }catch(e){ sb = null; live = true; }
  const ob=$("#open-orga"); if(ob) ob.hidden=!isAdmin;
  renderBanners(); renderRooms(); renderRides();
}

function fieldHTML(f, val, path){
  const [k,label,type,opts] = f; const id = "ed-"+path.replace(/\./g,"-");
  if(type==="textarea") return `<label class="wide" for="${id}">${label}<textarea id="${id}" data-path="${path}">${esc(val)}</textarea></label>`;
  if(type==="check") return `<label class="check" for="${id}"><input type="checkbox" id="${id}" data-path="${path}" ${val?"checked":""}>${label}</label>`;
  if(type==="select") return `<label for="${id}">${label}<select id="${id}" data-path="${path}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===val?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
  if(type==="number") return `<label for="${id}">${label}<input type="number" min="0" id="${id}" data-path="${path}" value="${esc(val)}"></label>`;
  if(type==="datetime") return `<label for="${id}">${label} (heure de Paris)<input type="datetime-local" id="${id}" data-path="${path}" value="${esc(String(val||"").slice(0,16))}"></label>`;
  if(type==="lines3") return `<label class="wide" for="${id}">${label}<textarea id="${id}" rows="7" data-path="${path}" data-kind="lines3">${esc((val||[]).map(r=>r.filter((x,i)=>i<2||x).join(" | ")).join("\n"))}</textarea></label>`;
  if(type==="image") return `<div style="grid-column:1/-1"><span style="font-size:13px;font-weight:600">${label}</span><div class="ed-img">
      ${val?`<img src="${esc(val)}" alt="">`:`<span class="note">Aucune image</span>`}
      <input type="file" accept="image/*" id="${id}" data-path="${path}" data-kind="image" style="width:auto;max-width:100%">
      ${val?`<button class="linkbtn" type="button" data-clear="${path}">Retirer</button>`:""}</div></div>`;
  return `<label for="${id}">${label}<input id="${id}" data-path="${path}" value="${esc(val)}"></label>`;
}
function renderEditor(){
  const box = $("#orga-inner",orgaEl); const s = SCHEMA[tab];
  if(s.live){ box.innerHTML = `<p class="ed-hint">Ce que les gens ont rempli en direct.</p><div id="orga-live"></div>`; renderOrgaLive(); return; }
  if(s.lines){ box.innerHTML = `<label class="ed-hint" for="ed-pack">Un élément par ligne</label><textarea id="ed-pack" rows="10" data-kind="lines" data-path="${tab}">${esc((draft[tab]||[]).join("\n"))}</textarea>`; }
  else if(!s.list){ box.innerHTML = `<div class="ed-item" style="padding-top:12px"><div class="ed-fields">${s.fields.map(f=>fieldHTML(f, draft.meta[f[0]], "meta."+f[0])).join("")}</div></div>
      <form class="ed-item" id="pwd-form" style="padding:14px;display:grid;gap:8px"><b>Mot de passe orga</b>
        <label class="ed-hint" for="pwd-new">Nouveau mot de passe (6 caractères min.), à partager avec Eliott</label>
        <input type="password" id="pwd-new" minlength="6" autocomplete="new-password" required>
        <button class="btn small" type="submit" style="justify-self:start">Changer le mot de passe</button><span class="note" id="pwd-status"></span></form>`;
    $("#pwd-form",box).onsubmit=async e=>{ e.preventDefault(); const np=$("#pwd-new",box).value;
      try{ await rpc("change_admin",{p_old:ADMIN_PWD,p_new:np}); ADMIN_PWD=np; try{sessionStorage.setItem("bdo-admin",np)}catch(_){} $("#pwd-new",box).value=""; $("#pwd-status",box).textContent="Mot de passe changé."; }
      catch(err){ $("#pwd-status",box).textContent="Échec : "+(err.message||"réessaie"); } }; }
  else {
    const arr = draft[tab];
    box.innerHTML = (s.hint?`<p class="ed-hint">${s.hint}</p>`:"") + arr.map((it,i)=>`<details class="ed-item" data-i="${i}" ${openItems.has(tab+i)?"open":""}>
      <summary>${s.img?(it[s.img]?`<img class="thumb" src="${esc(it[s.img])}" alt="">`:`<span class="thumb bg-${COLORS[i%5]}"></span>`):""}<span>${esc(s.title(it))}</span></summary>
      <div class="ed-fields">${s.fields.map(f=>fieldHTML(f, it[f[0]], `${tab}.${i}.${f[0]}`)).join("")}
        <div class="ed-actions"><button class="btn ghost small" type="button" data-move="${i}|-1" ${i===0?"disabled":""}>↑ Monter</button>
        <button class="btn ghost small" type="button" data-move="${i}|1" ${i===arr.length-1?"disabled":""}>↓ Descendre</button>
        <button class="btn ghost small" type="button" data-remove="${i}">Supprimer</button></div></div></details>`).join("")
      + `<button class="btn" type="button" id="ed-add">+ Ajouter</button>`;
    $("#ed-add",box).onclick=()=>{ arr.push(JSON.parse(JSON.stringify(s.blank))); openItems.add(tab+(arr.length-1)); saveDraft(); renderEditor(); };
    $$("[data-move]",box).forEach(b=>b.onclick=()=>{ const [i,d]=b.dataset.move.split("|").map(Number); const j=i+d; [arr[i],arr[j]]=[arr[j],arr[i]]; openItems.clear(); openItems.add(tab+j); saveDraft(); renderEditor(); });
    $$("[data-remove]",box).forEach(b=>b.onclick=()=>{ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Confirmer"; return; } arr.splice(+b.dataset.remove,1); openItems.clear(); saveDraft(); renderEditor(); });
    $$("details",box).forEach(d=>d.addEventListener("toggle",()=>{ const k=tab+d.dataset.i; d.open?openItems.add(k):openItems.delete(k); }));
  }
  $$("[data-path]",box).forEach(el=>el.addEventListener(el.type==="file"?"change":"input", ()=>onEdit(el)));
  $$("[data-clear]",box).forEach(b=>b.onclick=()=>{ setPath(b.dataset.clear,""); saveDraft(); renderEditor(); });
}
function setPath(path,val){ const ks=path.split("."); let o=draft; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=val; }
async function onEdit(el){
  const kind = el.dataset.kind, path = el.dataset.path;
  if(kind==="image"){ const f=el.files && el.files[0]; if(!f) return; status("Préparation de l'image…");
    try{ setPath(path, await shrink(f, path==="meta.logo"?900:560, path==="meta.logo")); saveDraft(); renderEditor(); }catch(e){ status("Image illisible, essaie un JPG ou un PNG."); } return; }
  if(kind==="lines"){ draft[path] = el.value.split("\n").map(s=>s.trim()).filter(Boolean); saveDraft(); return; }
  if(kind==="lines3"){ setPath(path, el.value.split("\n").map(s=>s.trim()).filter(Boolean).map(l=>{ const p=l.split("|").map(x=>x.trim()); return [p[0]||"",p[1]||"",p.slice(2).join(" | ")]; })); saveDraft(); return; }
  if(el.type==="checkbox") setPath(path, el.checked);
  else if(el.type==="number") setPath(path, el.value===""?"":+el.value);
  else setPath(path, el.value);
  saveDraft();
  const det = el.closest("details"); if(det){ const s=SCHEMA[tab]; const sp=$("summary span",det); if(sp) sp.textContent = s.title(draft[tab][+det.dataset.i]); }
}
function shrink(file, max, keepPng){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(keepPng ? c.toDataURL("image/png") : c.toDataURL("image/jpeg",0.8)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("img")); }; img.src=url; });
}
function renderOrgaLive(){
  const box = orgaEl && $("#orga-live",orgaEl); if(!box) return;
  const rd = roomsData();
  box.innerHTML = `<h3 class="c-mint">Chambres</h3><div class="live-list">${rd.map(r=>`<div><b>${esc(r.name)}</b><span>${r.people.map(p=>esc(p.name)).join(", ")||"—"} (${r.people.length}/${+r.cap||0})</span></div>`).join("")}
    ${beds.filter(b=>!rd.find(r=>r.key===b.roomKey)).map(b=>`<div><span>${esc(b.name)} : chambre supprimée ou renommée</span><button class="linkbtn" data-ob="${esc(b.id)}">retirer</button></div>`).join("")}</div>
    <h3 class="c-sky" style="margin-top:18px">Covoit</h3><div class="live-list">${rides.map(r=>`<div><span>${r.type==="offer"?"🚗":"🙋"} ${esc(r.name)} · ${esc(r.from)} · ${r.seats} pl. · ${(replies[r.id]||[]).length} réponse(s)</span><button class="linkbtn" data-or="${esc(r.id)}">supprimer</button></div>`).join("")||"<div>Aucune annonce</div>"}</div>`;
  $$("[data-ob]",box).forEach(b=>b.onclick=()=>rpc("free_bed",{p_id:b.dataset.ob,p_secret:SECRET,p_pwd:ADMIN_PWD}).then(loadBeds).catch(()=>{}));
  $$("[data-or]",box).forEach(b=>b.onclick=()=>{ if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="confirmer"; return; } rpc("del_ride",{p_id:b.dataset.or,p_secret:SECRET,p_pwd:ADMIN_PWD}).then(loadRides).catch(()=>{}); });
}
async function publishSite(){
  const btn=$("#orga-save",orgaEl); btn.disabled=true; status("Publication…");
  try{
    await rpc("save_site", {p_pwd:ADMIN_PWD, p_data:draft});
    SITE = JSON.parse(JSON.stringify(draft)); LS.del("bdo-draft");
    order = SITE.runners.map((_,i)=>i);
    keepForm(render); $("#open-orga").hidden=false; renderRooms(); renderRides();
    status("Publié ! Tout le monde voit la nouvelle version (après rechargement).");
  }catch(err){
    status(String(err && err.message).includes("mot de passe") ? "Mot de passe orga refusé : reconnecte-toi." : "La publication a échoué, réessaie.");
  }finally{ btn.disabled=false; }
}

/* ---------- boot ---------- */
render();
setInterval(tick, 30000);
document.addEventListener("keydown",e=>{ if(orgaEl){ if(e.key==="Escape") closeOrga(); return; } if(e.target.closest && e.target.closest("input,textarea,select")) return;
  const s=$("#coureurs"); if(!s) return; const r=s.getBoundingClientRect(); if(r.top<innerHeight&&r.bottom>0&&!$("#deck-wrap").hidden){ if(e.key==="ArrowRight") go(1); if(e.key==="ArrowLeft") $("#prev").click(); } });
connect().then(()=>{ if(location.hash==="#orga") openOrga(); });
})();
</script>
